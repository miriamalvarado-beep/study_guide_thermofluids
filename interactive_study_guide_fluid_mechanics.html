  <style>
    :root {
      --primary: #1e40af;
      --primary-hover: #1e3a8a;
      --secondary: #0f766e;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #15803d;
      --error: #b91c1c;
      --warning: #c2410c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
      border-left: 6px solid var(--primary);
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .course-info {
      display: inline-block;
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    /* Layout Structure */
    .app-container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar / Navigation */
    .sidebar {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      height: fit-content;
    }

    .nav-group {
      margin-bottom: 20px;
    }

    .nav-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 700;
    }

    .nav-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.95rem;
      margin-bottom: 6px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: #f1f5f9;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    /* Progress Tracker Sidebar */
    .progress-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .progress-bar-bg {
      background: #e2e8f0;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      background: var(--secondary);
      height: 100%;
      width: 0%;
      transition: width 0.3s;
    }

    /* Main Content Area */
    .main-content {
      background: var(--card-bg);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      min-height: 500px;
    }

    /* Question Cards */
    .question-card {
      margin-bottom: 24px;
    }

    .topic-badge {
      font-size: 0.8rem;
      background: #f0fdf4;
      color: var(--secondary);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid #bbf7d0;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--text);
    }

    .question-img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin: 12px 0;
      border: 1px solid var(--border);
    }

    /* Inputs and Buttons */
    .options-list {
      list-style: none;
      margin-bottom: 16px;
    }

    .option-item {
      margin-bottom: 8px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .option-label:hover {
      background: #f8fafc;
    }

    .option-label input {
      margin-right: 12px;
    }

    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .text-input, .num-input, .unit-input {
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .num-input {
      flex: 2;
      min-width: 150px;
    }

    .unit-input {
      flex: 1;
      min-width: 100px;
    }

    textarea.text-input {
      width: 100%;
      min-height: 100px;
      resize: vertical;
    }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .action-btn:hover {
      background: var(--primary-hover);
    }

    .action-btn.secondary {
      background: #64748b;
    }

    .action-btn.secondary:hover {
      background: #475569;
    }

    .action-btn.hint {
      background: var(--accent);
    }

    .action-btn.hint:hover {
      background: #b45309;
    }

    /* Hints and Feedback */
    .hint-box, .feedback-box {
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    .hint-box {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }

    .feedback-box.correct {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: var(--success);
    }

    .feedback-box.incorrect {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--error);
    }

    /* Exam Simulator Controls */
    .timer {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--warning);
      margin-bottom: 16px;
    }

    /* Dashboard Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--primary);
    }

    .stat-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>

  <script>
    // --- QUESTION DATABASE (37 Items from Word Document) ---
    const questionsDB = [
      // Unit 1: Properties of Fluids
      {
        id: 1,
        unit: "Properties",
        type: "conceptual",
        question: "What is a boundary layer?",
        answerText: "The boundary layer is the thin region of fluid flow adjacent to a solid surface where viscous forces and velocity gradients are dominant due to the no-slip condition.",
        hints: ["Think about what happens to fluid velocity near a solid wall."]
      },
      {
        id: 2,
        unit: "Properties",
        type: "conceptual",
        question: "What is a no-slip condition?",
        answerText: "The no-slip condition states that a fluid in direct contact with a solid surface sticks to the surface due to viscous effects, meaning its velocity relative to the boundary is zero.",
        hints: ["Consider the relative velocity between a wall and the fluid touching it."]
      },
      {
        id: 3,
        unit: "Properties",
        type: "conceptual",
        question: "Define pressure.",
        answerText: "Pressure is defined as a normal force exerted by a fluid per unit area. Formula: P = F / A. Its SI unit is the Pascal (Pa = N/m²).",
        hints: ["It is the ratio of force acting perpendicular to a surface."]
      },
      {
        id: 4,
        unit: "Properties",
        type: "conceptual",
        question: "When is a system a closed system, and when is it a control volume?",
        answerText: "A closed system consists of a fixed quantity of mass, and no mass can cross its boundary (only energy can). A control volume (open system) is a selected volume in space where both mass and energy can cross the control surface.",
        hints: ["Focus on whether mass can cross the system boundaries."]
      },
      {
        id: 5,
        unit: "Properties",
        type: "mcq",
        question: "If mass, heat, and work are not allowed to cross the boundaries of a system, the system is called?",
        options: ["Closed system", "Control volume", "Isolated system", "Steady-flow system"],
        correctAnswer: 2,
        explanation: "An isolated system allows neither mass nor energy (heat or work) interactions across its boundaries.",
        hints: ["It is completely cut off from its surroundings."]
      },
      {
        id: 6,
        unit: "Properties",
        type: "numerical",
        question: "A hydroelectric power plant operates at its rated power of 12 MW. If the plant has produced 26 million kWh of electricity in a specified year, determine the number of hours the plant operated that year.",
        targetValue: 2166.67,
        tolerance: 0.02,
        correctUnit: "hours",
        acceptedUnits: ["h", "hr", "hours", "hrs"],
        explanation: "Operating hours = Total Energy / Power = (26 × 10⁶ kWh) / (12 × 10³ kW) = 2166.67 hours.",
        hints: ["Convert rated power from MW to kW (12 MW = 12,000 kW).", "Divide total kWh by power in kW."]
      },
      {
        id: 7,
        unit: "Properties",
        type: "conceptual",
        question: "What is specific gravity? How is it related to density?",
        answerText: "Specific gravity (SG) is the ratio of the density of a substance to the density of a standard substance (usually water at 4°C, ρ_water = 1000 kg/m³). SG = ρ / ρ_water. It is dimensionless.",
        hints: ["It compares a fluid's density to water."]
      },
      {
        id: 8,
        unit: "Properties",
        type: "numerical",
        question: "A fluid that occupies a volume of 24 L weighs 225 N at a location where g = 9.80 m/s². Determine the mass of this fluid (in kg) and its density (in kg/m³).",
        multiPart: true,
        parts: [
          { label: "Mass (kg)", targetValue: 22.96, tolerance: 0.02, correctUnit: "kg" },
          { label: "Density (kg/m³)", targetValue: 956.6, tolerance: 0.02, correctUnit: "kg/m³" }
        ],
        explanation: "1) m = W / g = 225 N / 9.80 m/s² = 22.96 kg.\n2) V = 24 L = 0.024 m³. ρ = m / V = 22.96 kg / 0.024 m³ = 956.6 kg/m³.",
        hints: ["Use Newton's law W = m·g to find mass.", "Convert 24 L to m³ (divide by 1000)."]
      },

      // Unit 2: Pressure & Fluid Statics
      {
        id: 9,
        unit: "Pressure",
        type: "conceptual",
        question: "What is viscosity?",
        answerText: "Viscosity is a fluid property that measures its internal resistance to flow or deformation under shear stress.",
        hints: ["Think of it as fluid friction."]
      },
      {
        id: 10,
        unit: "Pressure",
        type: "numerical",
        question: "Consider a 55-kg woman who has a total foot imprint area of 400 cm². She wishes to walk on snow that cannot withstand pressures greater than 0.5 kPa. Determine the minimum imprint area per shoe (in cm²) needed to prevent sinking. (Use g = 9.81 m/s²)",
        targetValue: 5395.5,
        tolerance: 0.03,
        correctUnit: "cm²",
        acceptedUnits: ["cm2", "cm^2", "cm²"],
        explanation: "Total Weight = 55 kg × 9.81 m/s² = 539.55 N.\nMax Pressure = 0.5 kPa = 500 Pa.\nTotal required area = W / P = 539.55 / 500 = 1.0791 m² = 10791 cm².\nArea per snowshoe = Total Area / 2 = 5395.5 cm².",
        hints: ["Find total weight force F = m·g.", "P = F / A_total. Solve for total area.", "Divide total area by 2 for each shoe."]
      },
      {
        id: 11,
        unit: "Pressure",
        type: "numerical",
        question: "A vacuum gage connected to a tank reads 45 kPa at a location where the barometric reading is 755 mmHg. Determine the absolute pressure in the tank in kPa. (ρ_Hg = 13,590 kg/m³, g = 9.807 m/s²)",
        targetValue: 55.63,
        tolerance: 0.02,
        correctUnit: "kPa",
        acceptedUnits: ["kPa"],
        explanation: "P_atm = ρ·g·h = (13,590)(9.807)(0.755) = 100.63 kPa.\nP_abs = P_atm - P_vac = 100.63 - 45 = 55.63 kPa.",
        hints: ["Calculate atmospheric pressure using P_atm = ρ_Hg·g·h.", "For a vacuum gage: P_abs = P_atm - P_vac."]
      },
      {
        id: 12,
        unit: "Pressure",
        type: "numerical",
        question: "A manometer containing oil (ρ = 850 kg/m³) is attached to an air tank. If the oil-level difference between the two columns is 150 cm and atmospheric pressure is 98 kPa, determine the absolute pressure of the air in the tank in kPa. (g = 9.81 m/s²)",
        targetValue: 110.51,
        tolerance: 0.02,
        correctUnit: "kPa",
        acceptedUnits: ["kPa"],
        explanation: "P_gage = ρ·g·h = (850 kg/m³)(9.81 m/s²)(1.5 m) = 12507.75 Pa = 12.51 kPa.\nP_abs = P_atm + P_gage = 98 + 12.51 = 110.51 kPa.",
        hints: ["Convert 150 cm to meters (1.5 m).", "Calculate gage pressure P_gage = ρ_oil·g·h.", "P_abs = P_atm + P_gage."]
      },
      {
        id: 13,
        unit: "Pressure",
        type: "numerical",
        question: "A double-fluid manometer is attached to an air pipe. Fluid 1 has SG₁ = 13.55. Height 1 is 22 cm and Height 2 is 33 cm. If the absolute pressure of air is 76 kPa and atmospheric pressure is 100 kPa, determine the specific gravity SG₂ of the second fluid.",
        targetValue: 1.62,
        tolerance: 0.05,
        correctUnit: "",
        acceptedUnits: ["", "none", "dimensionless"],
        explanation: "P_air + ρ₁·g·h₁ - ρ₂·g·h₂ = P_atm\n76 + (13.55 × 9.81 × 0.22) - (SG₂ × 9.81 × 0.33) = 100\n76 + 29.25 - 3.237·SG₂ = 100 ⇒ SG₂ ≈ 1.62.",
        hints: ["Write the hydrostatic balance starting from the air pipe to the open end.", "SG = ρ / ρ_water."]
      },
      {
        id: 14,
        unit: "Pressure",
        type: "numerical",
        question: "Determine atmospheric pressure in kPa at a location where the barometric reading is 735 mmHg. (ρ_Hg = 13,600 kg/m³, g = 9.807 m/s²)",
        targetValue: 98.04,
        tolerance: 0.02,
        correctUnit: "kPa",
        acceptedUnits: ["kPa"],
        explanation: "P_atm = ρ·g·h = (13,600 kg/m³)(9.807 m/s²)(0.735 m) = 98,038 Pa = 98.04 kPa.",
        hints: ["P = ρ·g·h. Make sure h is in meters (0.735 m)."]
      },
      {
        id: 15,
        unit: "Pressure",
        type: "numerical",
        question: "A manometer containing a heavy liquid (ρ = 13,600 kg/m³) is connected to a tank. If the column height difference is 150 cm and atmospheric pressure is 98 kPa, calculate absolute pressure in kPa. (g = 9.81 m/s²)",
        targetValue: 298.12,
        tolerance: 0.02,
        correctUnit: "kPa",
        acceptedUnits: ["kPa"],
        explanation: "P_gage = (13,600)(9.81)(1.5) = 200,124 Pa = 200.12 kPa.\nP_abs = 98 + 200.12 = 298.12 kPa.",
        hints: ["P_abs = P_atm + ρ·g·h."]
      },
      {
        id: 16,
        unit: "Pressure",
        type: "conceptual",
        question: "Pressure head is standard atmospheric pressure expressed in column height h = P/(ρ·g). Express standard atmospheric pressure (101.325 kPa) in head of: (a) Mercury (SG=13.6), (b) Water (SG=1.0), (c) Glycerin (SG=1.26). Why is mercury preferred in manometers?",
        answerText: "(a) Mercury: h ≈ 0.76 m (760 mm).\n(b) Water: h ≈ 10.33 m.\n(c) Glycerin: h ≈ 8.2 m.\nMercury is preferred because its high density requires much shorter column heights, preventing impractically tall equipment.",
        hints: ["Use h = P / (ρ·g). Notice how column height varies inversely with liquid density."]
      },
      {
        id: 17,
        unit: "Pressure",
        type: "numerical",
        question: "A mercury manometer (ρ = 13,600 kg/m³) measures gas duct pressure. The level difference is h = 10 mm, and atmospheric pressure P0 = 100 kPa. If fluid level is lower on the duct side (P_gas = P0 + ρgh), calculate absolute pressure in kPa.",
        targetValue: 101.33,
        tolerance: 0.02,
        correctUnit: "kPa",
        acceptedUnits: ["kPa"],
        explanation: "P_gage = ρ·g·h = (13,600)(9.81)(0.010 m) = 1334 Pa = 1.334 kPa.\nP_abs = 100 + 1.334 = 101.33 kPa.",
        hints: ["Convert 10 mm to meters (0.01 m).", "P_abs = P_atm + ρ·g·h."]
      },

      // Unit 3: Dimensional Analysis
      {
        id: 18,
        unit: "Dimensional",
        type: "conceptual",
        question: "Write the primary dimensions of the universal ideal gas constant Ru from Ru = P·V / (n·T).",
        answerText: "P = {m·L⁻¹·t⁻²}, V = {L³}, n = {N} (moles), T = {T} (Temperature).\nRu = {m·L²·t⁻²·T⁻¹·N⁻¹}.\nIn SI base units: kg·m²/(s²·K·mol). In English units: lbm·ft²/(s²·R·lbmol).",
        hints: ["Substitute primary dimensions for pressure, volume, moles, and temperature."]
      },
      {
        id: 19,
        unit: "Dimensional",
        type: "conceptual",
        question: "What are the primary dimensions of electric voltage E? (Hint: Electric Power = Voltage × Current).",

      },
      {
        id: 20,
        unit: "Dimensional",
        type: "conceptual",
        question: "What are the primary dimensions of moment of force (torque)?",

      {
        id: 21,
        unit: "Dimensional",
        type: "conceptual",
        question: "What are the primary dimensions of electrical resistance R using Ohm's Law (ΔE = I·R)?",

      },
      {
        id: 22,
        unit: "Dimensional",
        type: "conceptual",
        question: "Write primary dimensions for: a) Acceleration a, b) Angular velocity ω, c) Angular acceleration α.",
        answerText: "a) Acceleration: {L·t⁻²}\nb) Angular velocity: {t⁻¹}\nc) Angular acceleration: {t⁻²}",

      },

      // Unit 4: Bernoulli & Energy Equations
      {
        id: 23,
        unit: "Bernoulli",
        type: "conceptual",
        question: "Define mass and volume flow rates. How are they related?",
        answerText: "Mass flow rate (ṁ) is mass passing through a cross-section per unit time. Volume flow rate (V̇) is volume passing per unit time. Relationship: ṁ = ρ · V̇.",

      },
      {
        id: 24,
        unit: "Bernoulli",
        type: "conceptual",
        question: "Name 4 conserved physical quantities and 2 non-conserved quantities during a general fluid process.",

      {

        unit: "Bernoulli",
        type: "conceptual",
        question: "Express Bernoulli's equation in three ways: a) Energies, b) Pressures, c) Heads.",

        multiPart: true,
        parts: [
          { label: "Mass flow rate (kg/s)", targetValue: 0.00350, tolerance: 0.02, correctUnit: "kg/s" },

        hints: ["Convert V̇ from m³/min to m³/s.", "A = V̇ / Velocity, then solve D = √(4A/π)."]
      },
      {
        id: 29,

        type: "numerical",
        question: "Air enters a nozzle at 2.21 kg/m³ and 20 m/s with inlet area 60 cm². It leaves at 0.762 kg/m³ and 150 m/s. Determine: a) mass flow rate (kg/s), b) exit area (cm²).",
        multiPart: true,
        parts: [
          { label: "Mass flow rate (kg/s)", targetValue: 0.265, tolerance: 0.02, correctUnit: "kg/s" },
          { label: "Exit Area (cm²)", targetValue: 23.2, tolerance: 0.02, correctUnit: "cm²" }
        ],
        explanation: "a) A1 = 0.006 m². ṁ = ρ1·A1·V1 = 2.21 × 0.006 × 20 = 0.2652 kg/s.\nb) ṁ = ρ2·A2·V2 ⇒ A2 = 0.2652 / (0.762 × 150) = 0.00232 m² = 23.2 cm².",
        hints: ["Convert 60 cm² to m² (0.006 m²).", "ṁ = ρ1·A1·V1", "Solve A2 = ṁ / (ρ2·V2)."]
      },

      // Unit 5: Momentum
      {
        id: 30,
        unit: "Momentum",
        type: "numerical",
        question: "A fan with 61-cm diameter blades moves 0.95 m³/s of air (ρ = 1.20 kg/m³). Assuming air approaches from rest and exits at uniform speed through the blade area, calculate: a) force required to hold the fan (N), b) minimum power input (W).",
        multiPart: true,
        parts: [
          { label: "Force (N)", targetValue: 3.72, tolerance: 0.04, correctUnit: "N" },
          { label: "Power (W)", targetValue: 6.05, tolerance: 0.04, correctUnit: "W" }
        ],
        explanation: "A = π(0.61)²/4 = 0.2922 m².\nV_exit = V̇ / A = 0.95 / 0.2922 = 3.251 m/s.\nṁ = ρ·V̇ = 1.20 × 0.95 = 1.14 kg/s.\na) Force F = ṁ·V_exit = 1.14 × 3.251 = 3.71 N.\nb) Power = ṁ·(V_exit²/2) = 1.14 × (3.251)² / 2 = 6.02 W.",
        hints: ["Find blade area A = πD²/4 and exit velocity V = V̇ / A.", "Force F = ṁ · ΔV", "Power = ½ ṁ V²"]
      },

      // Unit 6: Viscous Flow
      {
        id: 31,
        unit: "Viscous",
        type: "conceptual",
        question: "Why are liquids usually transported in circular pipes?",
        answerText: "Circular pipes withstand large pressure differences without distorting, and they offer the maximum cross-sectional area for a given perimeter, minimizing wall friction loss.",
        hints: ["Think about pressure resistance and perimeter-to-area ratio."]
      },
      {
        id: 32,
        unit: "Viscous",
        type: "mcq",
        question: "What is the generally accepted Reynolds number above which flow in smooth pipes becomes fully turbulent?",
        options: ["Re > 2000", "Re > 2300", "Re > 4000", "Re > 10000"],
        correctAnswer: 2,
        explanation: "Re < 2300 is laminar, 2300 ≤ Re ≤ 4000 is transitional, and Re > 4000 is turbulent.",
        hints: ["Transitional flow ends around 4000."]
      },
      {
        id: 33,
        unit: "Viscous",
        type: "mcq",
        question: "In fully developed pipe flow, if the length of the pipe is doubled, the head loss will:",
        options: ["Double", "More than double", "Less than double", "Reduce by half"],
        correctAnswer: 0,
        explanation: "Head loss is directly proportional to pipe length (hL ∝ L). Doubling length doubles head loss.",
        hints: ["Review Darcy-Weisbach equation: hL = f·(L/D)·(V²/2g)."]
      },
      {
        id: 34,
        unit: "Viscous",
        type: "mcq",
        question: "In fully developed laminar pipe flow, if diameter is halved while flow rate and length remain constant, head loss increases by a factor of:",
        options: ["2", "4", "8", "16"],
        correctAnswer: 3,
        explanation: "For laminar flow, f = 64/Re and hL = 128·μ·L·V̇ / (π·ρ·g·D⁴). Halving diameter (D/2) increases hL by 2⁴ = 16.",
        hints: ["Substitute V = 4V̇/(πD²) into Hagen-Poiseuille head loss equation."]
      },
      {
        id: 35,
        unit: "Viscous",
        type: "conceptual",
        question: "Explain why the friction factor is independent of Reynolds number at very high Reynolds numbers (fully rough turbulent flow).",
        answerText: "At very high Re, the laminar sublayer becomes thinner than the surface roughness elements. Viscous effects become negligible compared to pressure drag forces on roughness projections, making 'f' depend solely on relative roughness (ε/D).",
        hints: ["Consider the thickness of the laminar sublayer vs surface roughness."]
      },
      {
        id: 36,
        unit: "Viscous",
        type: "numerical",
        question: "Air at 40°C and 105 kPa flows through a 0.2 m × 0.3 m rectangular steel duct (40 m long) at 0.5 m³/s. Calculate pressure drop (in Pa) and head loss (in m). (Air: ρ = 1.168 kg/m³, μ = 1.91 × 10⁻⁵ kg/m·s, f ≈ 0.0203)",
        multiPart: true,
        parts: [
          { label: "Pressure drop (Pa)", targetValue: 124, tolerance: 0.05, correctUnit: "Pa" },
          { label: "Head loss (m)", targetValue: 10.8, tolerance: 0.05, correctUnit: "m" }
        ],
        explanation: "Dh = 4A/P = 4(0.06)/1.0 = 0.24 m. V = 0.5 / 0.06 = 8.33 m/s.\nΔP = f·(L/Dh)·(ρV²/2) = 0.0203 × (40/0.24) × (1.168 × 8.33² / 2) = 124 Pa.\nhL = ΔP / (ρ·g) = 124 / (1.168 × 9.81) = 10.8 m.",
        hints: ["Find hydraulic diameter Dh = 4A/P.", "Use Darcy-Weisbach equation for rectangular duct."]
      },
      {
        id: 37,
        unit: "Viscous",
        type: "numerical",
        question: "Water (ρ = 999.7 kg/m³, μ = 1.307×10⁻³ kg/m·s) flows in a 0.12-cm diameter, 15-m pipe at V = 0.9 m/s. Calculate: a) pressure drop (kPa), b) head loss (m), c) pumping power required (W).",
        multiPart: true,
        parts: [
          { label: "Pressure drop (kPa)", targetValue: 392, tolerance: 0.04, correctUnit: "kPa" },
          { label: "Head loss (m)", targetValue: 40.0, tolerance: 0.04, correctUnit: "m" },
          { label: "Pumping power (W)", targetValue: 0.399, tolerance: 0.04, correctUnit: "W" }
        ],
        explanation: "Re = ρVD/μ = (999.7)(0.9)(0.0012) / 1.307×10⁻³ = 826 (Laminar).\nf = 64/Re = 64/826 = 0.0775.\na) ΔP = f(L/D)(ρV²/2) = 392 kPa.\nb) hL = ΔP / (ρg) = 40.0 m.\nc) Power = ΔP · V̇ = 392,000 Pa × [π(0.0012)²/4 × 0.9] = 0.399 W.",
        hints: ["Check Reynolds number Re to confirm laminar flow.", "f = 64 / Re", "Power = ΔP · V̇."]
      }
    ];

    // --- APP STATE MANAGEMENT ---
    let currentMode = 'practice';
    let currentUnitFilter = 'all';
    let userProgress = JSON.parse(localStorage.getItem('fluid_mech_progress')) || {};
    let examQuestions = [];
    let examTimerInterval = null;
    let examTimeSeconds = 0;

    // --- INIT ---
    window.onload = function() {
      updateOverallProgress();
      renderCurrentMode();
    };

    function saveProgress() {
      localStorage.setItem('fluid_mech_progress', JSON.stringify(userProgress));
      updateOverallProgress();
    }

    function updateOverallProgress() {
      const total = questionsDB.length;
      let mastered = 0;
      for (let id in userProgress) {
        if (userProgress[id].mastered) mastered++;
      }
      const percent = Math.round((mastered / total) * 100);
      document.getElementById('overall-progress-bar').style.width = percent + '%';
      document.getElementById('overall-progress-text').innerText = `${mastered} of ${total} mastered (${percent}%)`;
    }

    // --- NAVIGATION ---
    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.sidebar .nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const unitNav = document.getElementById('units-nav');
      if (mode === 'practice') {
        unitNav.style.display = 'block';
      } else {
        unitNav.style.display = 'none';
      }

      if (examTimerInterval) clearInterval(examTimerInterval);
      renderCurrentMode();
    }

    function filterUnit(unit) {
      currentUnitFilter = unit;
      document.querySelectorAll('.unit-filter').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      renderPracticeMode();
    }

    function renderCurrentMode() {
      const container = document.getElementById('main-content');
      container.innerHTML = '';

      if (currentMode === 'practice') renderPracticeMode();
      else if (currentMode === 'exam') renderExamMode();
      else if (currentMode === 'review') renderReviewMode();
      else if (currentMode === 'dashboard') renderDashboardMode();

      if (window.MathJax) MathJax.typesetPromise();
    }

    // --- MODE 1: PRACTICE BY UNIT ---
    function renderPracticeMode() {
      const container = document.getElementById('main-content');
      let filtered = questionsDB;
      if (currentUnitFilter !== 'all') {
        filtered = questionsDB.filter(q => q.unit === currentUnitFilter);
      }

      container.innerHTML = `<h2>Practice Questions (${filtered.length})</h2><p style="color:var(--text-muted); margin-bottom:20px;">Complete exercises and check solutions step-by-step.</p>`;

      filtered.forEach(q => {
        const card = createQuestionCard(q);
        container.appendChild(card);
      });
    }

    function createQuestionCard(q, isExam = false) {
      const div = document.createElement('div');
      div.className = 'question-card';
      div.id = `q-card-${q.id}`;

      const prog = userProgress[q.id] || { attempts: 0, correct: 0, mastered: false };

      let html = `
        <span class="topic-badge">Unit: ${q.unit}</span>
        ${prog.mastered ? '<span style="color:var(--success); font-weight:bold; margin-left:10px;">✓ Mastered</span>' : ''}
        <div class="question-text">${q.id}. ${q.question}</div>
      `;

      if (q.type === 'conceptual') {
        html += `
          <textarea class="text-input" id="input-${q.id}" placeholder="Type your explanation here..."></textarea>
          <div>
            <button class="action-btn hint" onclick="toggleHint(${q.id})">💡 Hint</button>
            <button class="action-btn" onclick="checkConceptual(${q.id})">Check Answer</button>
          </div>
        `;
      } else if (q.type === 'mcq') {
        html += `<ul class="options-list">`;
        q.options.forEach((opt, idx) => {
          html += `
            <li class="option-item">
              <label class="option-label">
                <input type="radio" name="mcq-${q.id}" value="${idx}">
                ${opt}
              </label>
            </li>
          `;
        });
        html += `</ul>
          <div>
            <button class="action-btn hint" onclick="toggleHint(${q.id})">💡 Hint</button>
            <button class="action-btn" onclick="checkMCQ(${q.id})">Submit Answer</button>
          </div>
        `;
      } else if (q.type === 'numerical') {
        if (q.multiPart) {
          q.parts.forEach((part, pIdx) => {
            html += `
              <p><strong>${part.label}:</strong></p>
              <div class="input-group">
                <input type="number" step="any" class="num-input" id="num-${q.id}-${pIdx}" placeholder="Numerical value">
                <input type="text" class="unit-input" id="unit-${q.id}-${pIdx}" placeholder="Units (${part.correctUnit})">
              </div>
            `;
          });
        } else {
          html += `
            <div class="input-group">
              <input type="number" step="any" class="num-input" id="num-${q.id}" placeholder="Numerical answer">
              <input type="text" class="unit-input" id="unit-${q.id}" placeholder="Units (e.g., ${q.correctUnit})">
            </div>
          `;
        }
        html += `
          <div>
            <button class="action-btn hint" onclick="toggleHint(${q.id})">💡 Hint</button>
            <button class="action-btn" onclick="checkNumerical(${q.id})">Check Calculation</button>
          </div>
        `;
      }

      html += `<div id="hint-box-${q.id}" class="hint-box" style="display:none;"></div>`;
      html += `<div id="feedback-box-${q.id}" class="feedback-box" style="display:none;"></div>`;

      div.innerHTML = html;
      return div;
    }

    // --- INTERACTIVE ACTIONS & FEEDBACK ---
    function toggleHint(id) {
      const q = questionsDB.find(item => item.id === id);
      const box = document.getElementById(`hint-box-${id}`);
      if (box.style.display === 'none') {
        box.innerHTML = `<strong>Pista:</strong> ${q.hints ? q.hints.join('<br>') : 'Analiza las leyes de conservación y unidades.'}`;
        box.style.display = 'block';
      } else {
        box.style.display = 'none';
      }
    }

    function checkConceptual(id) {
      const q = questionsDB.find(item => item.id === id);
      const userText = document.getElementById(`input-${id}`).value.trim();
      const fb = document.getElementById(`feedback-box-${id}`);

      if (!userText) {
        fb.className = 'feedback-box incorrect';
        fb.innerHTML = 'Please enter an explanation before checking.';
        fb.style.display = 'block';
        return;
      }

      recordAttempt(id, true);
      fb.className = 'feedback-box correct';
      fb.innerHTML = `
        <strong>Reference Explanation:</strong><br>${q.answerText}<br><br>
        <small>Compare your answer with the reference above to evaluate your conceptual accuracy.</small>
      `;
      fb.style.display = 'block';
    }

    function checkMCQ(id) {
      const q = questionsDB.find(item => item.id === id);
      const selected = document.querySelector(`input[name="mcq-${id}"]:checked`);
      const fb = document.getElementById(`feedback-box-${id}`);

      if (!selected) {
        fb.className = 'feedback-box incorrect';
        fb.innerHTML = 'Please select an option.';
        fb.style.display = 'block';
        return;
      }

      const val = parseInt(selected.value);
      if (val === q.correctAnswer) {
        recordAttempt(id, true);
        fb.className = 'feedback-box correct';
        fb.innerHTML = `<strong>Correct! ✓</strong><br>${q.explanation}`;
      } else {
        recordAttempt(id, false);
        fb.className = 'feedback-box incorrect';
        fb.innerHTML = `<strong>Incorrect.</strong> Hint: ${q.hints[0] || 'Review fundamental definitions.'}`;
      }
      fb.style.display = 'block';
    }

    function checkNumerical(id) {
      const q = questionsDB.find(item => item.id === id);
      const fb = document.getElementById(`feedback-box-${id}`);

      let isCorrect = true;
      let errorMsg = "";

      if (q.multiPart) {
        q.parts.forEach((part, idx) => {
          const valInput = parseFloat(document.getElementById(`num-${id}-${idx}`).value);
          const unitInput = document.getElementById(`unit-${id}-${idx}`).value.trim().toLowerCase();

          if (isNaN(valInput)) {
            isCorrect = false;
            errorMsg += `Part ${idx+1}: Enter a valid number. `;
            return;
          }

          const relativeDiff = Math.abs(valInput - part.targetValue) / Math.abs(part.targetValue);
          if (relativeDiff > part.tolerance) {
            isCorrect = false;
            errorMsg += `Part ${idx+1}: Numerical value is outside acceptable tolerance. `;
          }

          if (part.correctUnit && !part.acceptedUnits.includes(unitInput)) {
            isCorrect = false;
            errorMsg += `Part ${idx+1}: Check units (expected: ${part.correctUnit}). `;
          }
        });
      } else {
        const valInput = parseFloat(document.getElementById(`num-${id}`).value);
        const unitInput = document.getElementById(`unit-${id}`).value.trim().toLowerCase();

        if (isNaN(valInput)) {
          isCorrect = false;
          errorMsg = "Enter a valid numerical value.";
        } else {
          const relativeDiff = Math.abs(valInput - q.targetValue) / Math.abs(q.targetValue);
          if (relativeDiff > q.tolerance) {
            isCorrect = false;
            errorMsg += "Numerical value is incorrect. Check calculations or rounding. ";
          }
          if (q.correctUnit && !q.acceptedUnits.includes(unitInput)) {
            isCorrect = false;
            errorMsg += `Unit error. Expected unit: ${q.correctUnit}. `;
          }
        }
      }

      if (isCorrect) {
        recordAttempt(id, true);
        fb.className = 'feedback-box correct';
        fb.innerHTML = `<strong>Correct Result! ✓</strong><br>Step-by-Step Solution:<br>${q.explanation.replace(/\n/g, '<br>')}`;
      } else {
        recordAttempt(id, false);
        fb.className = 'feedback-box incorrect';
        fb.innerHTML = `<strong>Incorrect or incomplete:</strong> ${errorMsg}<br><small>Try again or review hints.</small>`;
      }
      fb.style.display = 'block';
    }

    function recordAttempt(id, success) {
      if (!userProgress[id]) {
        userProgress[id] = { attempts: 0, correct: 0, mastered: false };
      }
      userProgress[id].attempts += 1;
      if (success) {
        userProgress[id].correct += 1;
        if (userProgress[id].correct >= 2) {
          userProgress[id].mastered = true;
        }
      }
      saveProgress();
    }

    // --- MODE 2: EXAM SIMULATOR ---
    function renderExamMode() {
      const container = document.getElementById('main-content');
      examQuestions = getRandomSample(questionsDB, 8);
      examTimeSeconds = 0;

      container.innerHTML = `
        <h2>Exam Simulator</h2>
        <p class="subtitle">8 random questions from all units. Results and step-by-step solutions are shown upon submission.</p>
        <div class="timer" id="exam-timer">Time: 00:00</div>
        <div id="exam-questions-list"></div>
        <button class="action-btn" onclick="submitExam()" style="margin-top:20px; width:100%;">Submit Exam</button>
      `;

      const listContainer = document.getElementById('exam-questions-list');
      examQuestions.forEach(q => {
        const card = createQuestionCard(q, true);
        listContainer.appendChild(card);
      });

      examTimerInterval = setInterval(() => {
        examTimeSeconds++;
        const mins = String(Math.floor(examTimeSeconds / 60)).padStart(2, '0');
        const secs = String(examTimeSeconds % 60).padStart(2, '0');
        document.getElementById('exam-timer').innerText = `Time: ${mins}:${secs}`;
      }, 1000);
    }

    function getRandomSample(arr, n) {
      const shuffled = [...arr].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, n);
    }

    function submitExam() {
      clearInterval(examTimerInterval);
      alert('Exam submitted. Reviewing your answers...');
      examQuestions.forEach(q => {
        if (q.type === 'conceptual') checkConceptual(q.id);
        else if (q.type === 'mcq') checkMCQ(q.id);
        else if (q.type === 'numerical') checkNumerical(q.id);
      });
    }

    // --- MODE 3: ERROR REVIEW ---
    function renderReviewMode() {
      const container = document.getElementById('main-content');
      const errorIds = Object.keys(userProgress).filter(id => {
        const p = userProgress[id];
        return p.attempts > 0 && (!p.mastered || p.correct < p.attempts);
      });

      if (errorIds.length === 0) {
        container.innerHTML = `
          <h2>Error Review</h2>
          <div class="feedback-box correct" style="display:block; margin-top:20px;">
            🎉 <strong>Great job!</strong> You have no pending incorrect questions registered in this session.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <h2>Review Pending Questions (${errorIds.length})</h2>
        <p class="subtitle">Practice questions you previously answered incorrectly to master them.</p>
      `;

      errorIds.forEach(id => {
        const q = questionsDB.find(item => item.id == id);
        if (q) {
          const card = createQuestionCard(q);
          container.appendChild(card);
        }
      });
    }

    // --- MODE 4: DASHBOARD ---
    function renderDashboardMode() {
      const container = document.getElementById('main-content');
      
      let totalAttempted = 0;
      let totalMastered = 0;
      let totalCorrect = 0;
      let totalAttempts = 0;

      for (let id in userProgress) {
        const p = userProgress[id];
        if (p.attempts > 0) totalAttempted++;
        if (p.mastered) totalMastered++;
        totalCorrect += p.correct;
        totalAttempts += p.attempts;
      }

      const successRate = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;

      container.innerHTML = `
        <h2>Progress Dashboard</h2>
        <p class="subtitle">Overview of performance and topic mastery.</p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${totalAttempted} / 37</div>
            <div class="stat-label">Attempted</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${totalMastered} / 37</div>
            <div class="stat-label">Mastered (2+ Correct)</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${successRate}%</div>
            <div class="stat-label">Accuracy Rate</div>
          </div>
        </div>

        <h3>Progress by Unit</h3>
        <div style="margin-top:16px;">
          ${renderUnitProgress('Properties', '1. Fluid Properties')}
          ${renderUnitProgress('Pressure', '2. Pressure & Fluid Statics')}
          ${renderUnitProgress('Dimensional', '3. Dimensional Analysis')}
          ${renderUnitProgress('Bernoulli', '4. Bernoulli & Energy')}
          ${renderUnitProgress('Momentum', '5. Momentum')}
          ${renderUnitProgress('Viscous', '6. Viscous Flow')}
        </div>

        <button class="action-btn secondary" onclick="resetProgress()" style="margin-top:24px;">Reset All Progress</button>
      `;
    }

    function renderUnitProgress(unitKey, label) {
      const unitQs = questionsDB.filter(q => q.unit === unitKey);
      let mastered = 0;
      unitQs.forEach(q => {
        if (userProgress[q.id] && userProgress[q.id].mastered) mastered++;
      });
      const pct = Math.round((mastered / unitQs.length) * 100);

      return `
        <div style="margin-bottom:12px;">
          <div style="display:flex; justify-between; font-weight:600; font-size:0.9rem;">
            <span>${label}</span>
            <span>${mastered} / ${unitQs.length} (${pct}%)</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width:${pct}%;"></div>
          </div>
        </div>
      `;
    }

    function resetProgress() {
      if (confirm('Are you sure you want to reset all saved progress?')) {
        localStorage.removeItem('fluid_mech_progress');
        userProgress = {};
        updateOverallProgress();
        renderDashboardMode();
      }
    }
  </script>
</body>
</html>
